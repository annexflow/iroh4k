name: CI

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The targets that can actually be *tested*, not merely linked. Both facades run here: the
  # Kotlin/Native tests exercise the statically-linked FFI path, the JVM tests the JNI path
  # against the same Rust core.
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            targets: macosArm64,jvm
            tasks: ":iroh4k:macosArm64Test :iroh4k:jvmTest"
          - os: ubuntu-latest
            targets: linuxX64,jvm
            tasks: ":iroh4k:linuxX64Test :iroh4k:jvmTest"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install Rust
        run: rustup show

      # Keyed on Cargo.lock: the crate takes minutes to build from cold, and ~/.konan is a large
      # download. Both are pure function of their inputs, so caching them is safe.
      - name: Cache cargo and konan
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.konan
            iroh4k/src/rust/target
          key: ${{ matrix.os }}-iroh4k-${{ hashFiles('iroh4k/src/rust/Cargo.lock') }}
          restore-keys: ${{ matrix.os }}-iroh4k-

      - uses: gradle/actions/setup-gradle@v6

      # Run the two test tasks in separate invocations. Sharing one invocation has been observed
      # to let a Rust rebuild swap the JNI shared library out from under a running test JVM,
      # producing NoClassDefFoundError and a dead test worker rather than an honest failure.
      - name: Test
        run: |
          for task in ${{ matrix.tasks }}; do
            ./gradlew "$task" -Ptargets=${{ matrix.targets }}
          done

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: |
            iroh4k/build/test-results/**/*.xml
            iroh4k/**/hs_err_pid*.log

  # Android, in three passes over one expensive Rust build. The host tests are the JNI facade under
  # Robolectric on the runner's own JVM — the same `Common*Tests` bodies as jvmTest, so a break
  # there is a break in the shared code or in the Android loader. The assemble cross-compiles the
  # real per-ABI `.so` with cargo-ndk and packages the AAR. The emulator run is the only pass that
  # exercises what a host cannot: `System.loadLibrary` on the packaged `.so`, ART, the manifest's
  # permissions, and `androidx.startup` having installed the Android context. Both of the Android
  # defects this project has had were invisible to every host test and fatal on a device, which is
  # why the emulator is worth its minutes.
  #
  # All three share one job because the cargo-ndk build dominates the cost; splitting them would
  # pay for it twice.
  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Add Rust targets
        run: rustup target add aarch64-linux-android x86_64-linux-android

      # ~/.cargo/bin holds the cargo-ndk binary, which takes about a minute to build from source
      # and changes only when its version does. The rest is the usual cargo/konan cache.
      - name: Cache cargo and konan
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            ~/.konan
            ~/.m2/repository
            iroh4k/src/rust/target
          key: ubuntu-latest-android-${{ hashFiles('iroh4k/src/rust/Cargo.lock') }}
          restore-keys: ubuntu-latest-android-

      # `--locked` so a cached binary is reused rather than silently upgraded, and the install is
      # skipped outright when the cache already has it.
      - name: Install cargo-ndk
        run: command -v cargo-ndk || cargo install cargo-ndk --locked

      - uses: gradle/actions/setup-gradle@v6

      # The runner image exports ANDROID_NDK_HOME, which is where `rustJni` looks first; on a
      # machine without it the plugin falls back to ndk.dir/sdk.dir in local.properties.
      # Robolectric downloads its android-all jar into ~/.m2 on the first run, hence that cache
      # path above.
      - name: Host tests
        run: ./gradlew :iroh4k:testAndroidHostTest -Ptargets=jvm,android

      # Builds the `.so` for both 64-bit ABIs and packages the AAR. Kept a separate invocation
      # from the tests for the same reason the test job splits its tasks: a Rust rebuild must not
      # land underneath a running test JVM.
      - name: Assemble AAR
        run: ./gradlew :iroh4k:assemble -Ptargets=jvm,android

      # The emulator is unusably slow without hardware acceleration, and the runner image ships
      # /dev/kvm but not the permissions to use it.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Booting an AVD from cold costs minutes; a cached snapshot makes the run below start from a
      # booted system. Keyed on the API level alone, since nothing else about the AVD varies.
      - name: Cache AVD
        uses: actions/cache@v6
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-x86_64

      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      # x86_64 because that is the runner's architecture, and it is one of the two ABIs the AAR
      # ships — so this runs the same `.so` a consumer on an x86_64 device would get. API 34 is
      # comfortably above the library's minSdk of 26.
      - name: Device tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew :iroh4k:connectedAndroidDeviceTest -Ptargets=jvm,android

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-android
          path: |
            iroh4k/build/test-results/**/*.xml
            iroh4k/build/outputs/androidTest-results/**/*.xml
            iroh4k/**/hs_err_pid*.log

  # Targets that cannot run tests here (no device, no emulator, or no runner) but must still
  # compile and link. Linking is the part that breaks: the Rust static library pulls in a
  # different set of system libraries per platform, and the `.def` linkerOpts have to match.
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: iosArm64
            rust: aarch64-apple-ios
          - os: macos-latest
            target: iosSimulatorArm64
            rust: aarch64-apple-ios-sim
          - os: ubuntu-latest
            target: linuxArm64
            rust: aarch64-unknown-linux-gnu
          - os: windows-latest
            target: mingwX64
            rust: x86_64-pc-windows-gnu
          # The Kotlin/Native Android targets, which are a different path from the AAR job above:
          # cinterop against a static library, not cargo-ndk against a shared one. They link
          # against an API 21 sysroot, which is what the toolchain step below pins.
          - os: ubuntu-latest
            target: androidNativeArm64
            rust: aarch64-linux-android
          - os: ubuntu-latest
            target: androidNativeX64
            rust: x86_64-linux-android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: ./.github/actions/rust-target
        with:
          triples: ${{ matrix.rust }}

      - name: Cache cargo and konan
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.konan
            iroh4k/src/rust/target
          key: ${{ matrix.os }}-${{ matrix.target }}-${{ hashFiles('iroh4k/src/rust/Cargo.lock') }}
          restore-keys: ${{ matrix.os }}-${{ matrix.target }}-

      - uses: gradle/actions/setup-gradle@v6

      - name: Assemble
        run: ./gradlew :iroh4k:assemble -Ptargets=${{ matrix.target }}

  lint:
    name: Rust lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup component add clippy rustfmt
      - name: Format
        run: cargo fmt --manifest-path iroh4k/src/rust/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --manifest-path iroh4k/src/rust/Cargo.toml --release -- -D warnings
