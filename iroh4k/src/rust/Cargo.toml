[package]
name = "iroh4k"
version = "0.2.0"
edition = "2024"
# Edition 2024 itself needs 1.85; the floor is higher because `iroh` 1.0 declares 1.91. Edition 2024
# also selects resolver 3, which is MSRV-aware — so this has to be stated, not inferred.
rust-version = "1.91"
publish = false
# Same terms as the Kotlin artifact and as iroh itself. The crate is never published — the license
# is here so a vendored or audited copy of this source tree carries its terms with it.
license = "MIT OR Apache-2.0"

[lib]
# staticlib -> linked into Kotlin/Native targets via cinterop (FFI).
# cdylib    -> loaded at runtime by the JVM and Android via JNI.
crate-type = ["staticlib", "cdylib"]

[profile.release]
opt-level = 3
strip = true
lto = true
# Unwinding across the `extern "C"` FFI boundary is undefined behaviour, so we abort.
# All recoverable errors are returned as result values, never panics.
panic = "abort"
codegen-units = 1

[dependencies]
# https://crates.io/crates/tokio
tokio = { version = "1", features = ["rt-multi-thread"] }

# https://crates.io/crates/iroh
# `tls-ring` is part of iroh's default feature set. Keep it: the alternative
# (`tls-aws-lc-rs`) needs cmake + a C toolchain and cross-compiles poorly to
# iOS/Android/mingw. Never enable `tls-aws-lc-rs` here.
iroh = { version = "1.0.3" }
# https://crates.io/crates/iroh-base
iroh-base = { version = "1.0.3" }
# https://crates.io/crates/iroh-relay
iroh-relay = { version = "1.0.3", default-features = false }
# https://crates.io/crates/iroh-services
iroh-services = { version = "1.0.0", default-features = false }
# https://crates.io/crates/iroh-tickets
iroh-tickets = { version = "1.0.0" }
# https://crates.io/crates/iroh-metrics
iroh-metrics = { version = "1.0.1" }
# https://crates.io/crates/iroh-mdns-address-lookup
# mDNS is not part of the `iroh` crate in 1.0; it is this separate address-lookup service, which
# both advertises this endpoint on the local link and resolves the peers advertising themselves on
# it. Only reached when `EndpointConfig.mdns` is set, so an endpoint that does not ask for it sends
# no multicast traffic at all.
iroh-mdns-address-lookup = { version = "0.4.0" }

# https://crates.io/crates/url
url = "2"

# https://crates.io/crates/n0-future
n0-future = "0.3"
# https://crates.io/crates/n0-watcher
n0-watcher = "1.0"
# https://crates.io/crates/n0-error
n0-error = "1.0"

# https://crates.io/crates/tracing
tracing = "0.1"
# https://crates.io/crates/tracing-subscriber
tracing-subscriber = "0.3"

# https://crates.io/crates/jni
# Only needed for the JNI (JVM/Android) path. iOS uses the FFI/cinterop path exclusively.
[target.'cfg(not(target_os = "ios"))'.dependencies]
jni = { version = "0.22.4" }

# https://crates.io/crates/ndk-context
# Already in the tree transitively — hickory-resolver reads Android's DNS servers through it and
# netdev enumerates interfaces through it — but nothing initializes it, and its accessor is an
# `expect`. Depending on it directly is what lets `src/android.rs` install the JavaVM and Context
# before iroh does, instead of the process aborting inside `Endpoint::bind`.
[target.'cfg(target_os = "android")'.dependencies]
ndk-context = { version = "0.1.1" }

[build-dependencies]
# https://crates.io/crates/cbindgen
cbindgen = "0.29.2"
