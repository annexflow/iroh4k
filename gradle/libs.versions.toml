[versions]
# https://plugins.gradle.org/plugin/org.jetbrains.kotlin.jvm
kotlin = "2.4.10"
# https://github.com/Kotlin/kotlinx.coroutines
kotlinx-coroutines = "1.11.0"
# https://github.com/Kotlin/kotlinx-io
kotlinx-io = "0.9.1"
# https://github.com/willowtreeapps/assertk
assertk = "0.28.1"
# https://github.com/vanniktech/gradle-maven-publish-plugin
publish = "0.37.0"
# https://github.com/Kotlin/dokka
dokka = "2.2.0"
# https://developer.android.com/studio/releases/gradle-plugin
android-gradle-plugin = "9.3.1"

[libraries]
gradle-kotlin-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
gradle-publish-plugin = { module = "com.vanniktech:gradle-maven-publish-plugin", version.ref = "publish" }
gradle-dokka-plugin = { module = "org.jetbrains.dokka:dokka-gradle-plugin", version.ref = "dokka" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-io-core = { module = "org.jetbrains.kotlinx:kotlinx-io-core", version.ref = "kotlinx-io" }
assertk = { module = "com.willowtreeapps.assertk:assertk", version.ref = "assertk" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
publish = { id = "com.vanniktech.maven.publish", version.ref = "publish" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
android = { id = "com.android.kotlin.multiplatform.library", version.ref = "android-gradle-plugin" }
